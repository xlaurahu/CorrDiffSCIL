# Runs post_processing/run_daily.py on a schedule: calls a CorrDiff NIM,
# converts the result to both zarr formats (curvilinear + regridded 1-D
# lat/lon), and writes them to a PVC — from which you pull output however you
# like (`kubectl cp`, a sync job, mount it from something else, etc.). This is
# a worked EXAMPLE for one Kubernetes cluster; adapt names/resources to yours.
#
# Every `<angle-bracket>` placeholder below must be filled in before applying.
#
# Prerequisite 1: a CorrDiff NIM already running, with its public Ingress
# deployed (see the repo root's corrdiff-nim-deployment.yaml /
# corrdiff-nim-ingress.yaml for a starting point). CORRDIFF_NIM_USERNAME below
# reaches it at https://corrdiff-<your-username>.nrp-nautilus.io by default --
# note that even though this Job runs in the same namespace as the NIM, going
# through CORRDIFF_NIM_USERNAME still round-trips out through the public
# internet. If that matters, swap CORRDIFF_NIM_USERNAME below for
# CORRDIFF_NIM_HOST="http://corrdiff-nim-service-<your-username>:8000" to use
# the free, fast in-cluster path instead.
#
# Prerequisite 2: create the ConfigMap holding this folder's driver scripts +
# packaging metadata (just the code -- ConfigMaps cap out around 1MB total,
# well under the ~15MB-each grid .npy files, which is why those are fetched
# separately below rather than included here):
#
#   kubectl create configmap corrdiff-scripts -n <your-namespace> \
#     --from-file=post_processing/corrdiff_predict.py \
#     --from-file=post_processing/corrdiff_to_zarr.py \
#     --from-file=post_processing/corrdiff_to_latlon_zarr.py \
#     --from-file=post_processing/corrdiff_fetch_grid.py \
#     --from-file=post_processing/run_daily.py \
#     --from-file=post_processing/pyproject.toml
#
# Re-run that command (it will fail if the ConfigMap already exists — delete
# it first, or use `kubectl create ... --dry-run=client -o yaml | kubectl apply -f -`)
# whenever these files change.
#
# Prerequisite 3: the two grid .npy files (corrdiff_output_lat.npy /
# corrdiff_output_lon.npy) must exist on the output PVC at /corrdiff-grid/.
# They're published as a GitHub Release (not deployment-specific -- same grid
# for everyone), so a throwaway pod with this folder's deps installed just
# needs to run `corrdiff-fetch-grid --grid-dir /corrdiff-grid` once. No
# kubectl cp, no cluster-internal source required.
#
# Then: kubectl apply -f post_processing/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: corrdiff-daily
  namespace: <your-namespace>
spec:
  schedule: "0 0 * * *"  # 00:00 UTC daily
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 5400  # 90 min safety cap
      template:
        spec:
          restartPolicy: OnFailure
          # No GPU needed anywhere in this pod — inference happens in the NIM
          # pod; this only calls it over HTTP and does CPU-side pre/post-
          # processing, so a plain Python image is enough.
          initContainers:
            - name: install-deps
              image: python:3.12-slim
              command:
                - pip
                - install
                - --target=/deps
                - --extra-index-url=https://download.pytorch.org/whl/cpu
                - /app/corrdiff
              volumeMounts:
                - name: corrdiff-scripts
                  mountPath: /app/corrdiff
                - name: deps
                  mountPath: /deps
          containers:
            - name: corrdiff-daily
              image: python:3.12-slim
              command: ["python", "/app/corrdiff/run_daily.py"]
              env:
                - name: PYTHONPATH
                  value: /app/corrdiff:/deps
                - name: CORRDIFF_NIM_USERNAME
                  value: "<your-username>"
                - name: CORRDIFF_OUTPUT_DIR
                  value: /output/corrdiff
                - name: CORRDIFF_GRID_DIR
                  value: /output/corrdiff-grid
                - name: CORRDIFF_HOURS
                  value: "3,6,9,12,15,18,21,24"
                - name: CORRDIFF_VARIABLES
                  value: "tp,t2m"
                - name: CORRDIFF_SAMPLES
                  value: "5"
                - name: CORRDIFF_STEPS
                  value: "10"
                - name: CORRDIFF_DATE_OFFSET_DAYS
                  value: "1"
              resources:
                # Tune to your cluster. Some clusters cap the limits:requests
                # ratio via admission policy (e.g. 1.2x) — check yours before
                # setting these far apart.
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "2400m"
                  memory: 9Gi
              volumeMounts:
                - name: corrdiff-scripts
                  mountPath: /app/corrdiff
                - name: deps
                  mountPath: /deps
                - name: corrdiff-output
                  mountPath: /output
          volumes:
            - name: corrdiff-scripts
              configMap:
                name: corrdiff-scripts
            - name: deps
              emptyDir: {}
            - name: corrdiff-output
              persistentVolumeClaim:
                claimName: <your-output-pvc>
